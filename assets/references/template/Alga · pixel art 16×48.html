<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alga · pixel art 16×48</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f8;--fg:#12263a;--water:#1b4a73;--line:#12385a;--btn:#fff;--bd:#c5d3e0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1620;--fg:#e6eef6;--btn:#16273a;--bd:#2c4560}}
:root[data-theme="dark"]{--bg:#0d1620;--fg:#e6eef6;--btn:#16273a;--bd:#2c4560}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 14px}
main{max-width:340px;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 4px}
p{margin:0 0 14px;opacity:.8;font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(16,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.grid.off{gap:0}
.grid i{aspect-ratio:1;background:var(--water);display:block}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Alga 🌿</h1>
<p>Sprite de 16×48 píxeles que se mece con la corriente.</p>
<div class="grid" id="a"></div>
<div class="bar"><button id="pp">Pausa</button><button id="gr">Ocultar cuadrícula</button></div>
</main>
<script>
const W=16,H=48,N=8;
const col={'.':'',m:'#2fa356',d:'#1f6b3a',l:'#7fe0993',s:'#d9b77a',t:'#b8955a',r:'#6b6f7a',R:'#8a8f9c'};
col.l='#7fe099';
const mk=()=>Array.from({length:H},()=>Array(W).fill('.'));
const put=(g,y,x,c)=>{if(y>=0&&y<H&&x>=0&&x<W)g[y][x]=c};
const leaves=[40,34,28,22,16,10,5];
function frame(t){
  const g=mk(),sxs=[];
  for(let y=0;y<=44;y++){
    const h=(44-y)/44;
    const sx=7+Math.round(3.2*Math.pow(h,1.3)*Math.sin(t*2*Math.PI/N-y*0.17));
    sxs[y]=sx;
    if(y<2){put(g,y,sx,'l');continue}
    put(g,y,sx,'m');put(g,y,sx+1,'d');
  }
  leaves.forEach((y,k)=>{
    const sx=sxs[y],short=y<12,dir=k%2===0?1:-1;
    const o=dir===1?sx+2:sx-1; // primer píxel junto al tallo
    const at=(dy,dx,c)=>put(g,y+dy,o+dir*dx,c);
    at(0,0,'m');at(0,1,'m');
    at(1,0,'d');at(1,1,'d');
    at(-1,1,'m');at(-1,2,'m');
    if(!short){at(-1,3,'m');at(-2,3,'l');at(-2,4,'l')}
    else{at(-2,2,'l');at(-2,3,'l')}
  });
  // base: arena y piedras
  for(let y=45;y<H;y++)for(let x=0;x<W;x++)g[y][x]=y===H-1?'t':'s';
  [[45,2],[45,3],[45,4],[46,3],[45,11],[45,12],[46,11],[46,12],[46,13]].forEach(([y,x])=>g[y][x]='r');
  [[45,2],[45,11]].forEach(([y,x])=>g[y][x]='R');
  [[45,6],[45,7],[45,8],[45,9]].forEach(([y,x])=>g[y][x]='d');
  return g;
}
const el=document.getElementById('a'),cells=[];
for(let k=0;k<W*H;k++){const c=document.createElement('i');el.appendChild(c);cells.push(c)}
function draw(g){let k=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)cells[k++].style.background=col[g[y][x]]}
let i=0,run=true;
function tick(){draw(frame(i));i=(i+1)%N}
tick();setInterval(()=>{if(run)tick()},200);
document.getElementById('pp').onclick=e=>{run=!run;e.target.textContent=run?'Pausa':'Reanudar'};
document.getElementById('gr').onclick=e=>{
  const off=el.classList.toggle('off');
  e.target.textContent=off?'Mostrar cuadrícula':'Ocultar cuadrícula';
};
</script>
</body>
</html>
